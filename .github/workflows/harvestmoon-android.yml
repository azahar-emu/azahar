name: Harvest Moon Android APK

on:
  push:
    branches: [harvestmoon-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: vanilla
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache apksigner
          echo "y" | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "cmake;3.30.3"

      - name: Restore build cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: android-vanilla-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            android-vanilla-${{ runner.os }}-

      - name: Build Android release APK
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh

      - name: Package build artifacts
        working-directory: src/android/app
        env:
          UNPACKED: 1
        run: ../../../.ci/pack.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: harvest-moon-android-apk
          path: src/android/app/artifacts/
          if-no-files-found: error
          retention-days: 14
